<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>창천 3층 3D 지도</title>
<style>
:root {
  --navy: #1b365d;
  --ink: #1f2937;
  --muted: #5a6577;
  --line: rgba(27, 54, 93, 0.12);
  --glass: rgba(255, 255, 255, 0.82);
  font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd8de; color: var(--ink); }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.labels { position: fixed; inset: 0; }

.card {
  position: fixed; z-index: 5;
  background: var(--glass);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border: 1px solid rgba(255, 255, 255, 0.7);
  box-shadow: 0 10px 30px -12px rgba(15, 30, 55, 0.35), 0 1px 0 rgba(255, 255, 255, 0.6) inset;
  border-radius: 14px;
}
.brand { top: 20px; left: 20px; padding: 16px 20px 14px; min-width: 250px; }
.brand .eyebrow { font-size: 11px; letter-spacing: 0.14em; color: var(--muted); font-weight: 700; }
.brand h1 { margin: 4px 0 6px; font-size: 19px; color: var(--navy); letter-spacing: -0.01em; }
.brand .sub { margin: 0; font-size: 12px; color: var(--muted); }

.controls { top: 20px; right: 20px; padding: 12px; width: 270px; display: flex; flex-direction: column; gap: 10px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: rgba(27, 54, 93, 0.07); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 8px 0; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; transition: all .2s; }
.seg button.on { background: var(--navy); color: #fff; box-shadow: 0 4px 12px -4px rgba(27, 54, 93, .6); }
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ghost { border: 1px solid var(--line); background: rgba(255, 255, 255, .7); border-radius: 9px; padding: 7px 0; font: inherit; font-size: 12px; color: var(--ink); cursor: pointer; transition: background .2s, border-color .2s; }
.ghost:hover { background: #fff; border-color: rgba(27, 54, 93, .35); }
#search-wrap input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; font: inherit; font-size: 13px; background: #fff; outline: none; }
#search-wrap input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(27, 54, 93, .12); }
#results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 260px; overflow: auto; }
#results li { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
#results li:hover { background: rgba(27, 54, 93, .07); }
#results li span { color: var(--muted); font-size: 11.5px; }
#results li.none { color: var(--muted); cursor: default; }

.profile { left: 20px; bottom: 34px; width: 300px; padding: 14px; display: flex; gap: 14px; align-items: center; }
.profile .photo { width: 84px; height: 106px; flex: none; border-radius: 10px; overflow: hidden; background: #e7ebf0; display: grid; place-items: center; }
.profile .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
.profile .initial { font-size: 22px; font-weight: 800; color: var(--navy); }
.profile .name { font-size: 17px; font-weight: 800; color: var(--navy); }
.profile .title { font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.profile .fields { font-size: 12px; color: var(--ink); margin-top: 8px; line-height: 1.45; }
.profile .where { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.profile .close { position: absolute; top: 6px; right: 8px; border: 0; background: transparent; font-size: 18px; color: var(--muted); cursor: pointer; }
#tip { position: fixed; left: 0; top: 0; z-index: 6; pointer-events: none; background: rgba(20, 30, 45, .88); color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 7px; white-space: nowrap; }
.credit { position: fixed; right: 14px; bottom: 10px; z-index: 5; font-size: 10.5px; color: rgba(30, 40, 55, .6); }

/* 3D 라벨 */
.lbl { pointer-events: none; white-space: nowrap; transform: translateY(-4px); }
.lbl.room { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, .92); border: 1px solid rgba(27, 54, 93, .18); padding: 3px 9px 3px 3px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--ink); box-shadow: 0 4px 12px -6px rgba(0, 0, 0, .35); }
.lbl.room b { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 11px; }
.lbl.room.empty { color: var(--muted); }
.lbl.room.empty b { background: #9aa6b5; }
.lbl.fac { font-size: 11px; font-weight: 700; color: var(--navy); background: rgba(255, 255, 255, .78); padding: 3px 8px; border-radius: 6px; letter-spacing: .02em; }
.lbl.person { font-size: 11.5px; font-weight: 700; color: #fff; background: rgba(27, 54, 93, .9); padding: 3px 8px; border-radius: 6px; box-shadow: 0 4px 10px -4px rgba(0, 0, 0, .4); }
.lbl.person em { font-style: normal; font-weight: 500; opacity: .75; margin-left: 5px; font-size: 10px; }
.lbl.person.walking { background: rgba(90, 101, 119, .92); }
.lbl.person.hl { background: #c8102e; transform: translateY(-4px) scale(1.15); }

#loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: linear-gradient(160deg, #e9eef2, #cfd8de); transition: opacity .8s; }
#loading.done { opacity: 0; pointer-events: none; }
#loading .box { text-align: center; color: var(--navy); font-size: 14px; }
#loading .bar { margin-top: 12px; width: 220px; height: 3px; background: rgba(27, 54, 93, .15); border-radius: 3px; overflow: hidden; }
#loading .bar i { display: block; height: 100%; width: 0; background: var(--navy); transition: width .3s; }

@media (max-width: 720px) {
  .brand { left: 10px; top: 10px; min-width: 0; padding: 12px 14px; }
  .brand .sub { display: none; }
  .controls { top: auto; bottom: 28px; right: 10px; left: 10px; width: auto; }
}

.profile[hidden] { display: none; }


.toggle { border: 1px solid var(--line); background: rgba(27, 54, 93, .07); border-radius: 9px; padding: 8px 0; font: inherit; font-size: 12.5px; font-weight: 700; color: var(--muted); cursor: pointer; }
.toggle.on { background: var(--navy); color: #fff; border-color: var(--navy); }

.lbl.person { display: flex; align-items: center; gap: 5px; }
.lbl.person b { display: grid; place-items: center; min-width: 17px; height: 17px; padding: 0 3px; border-radius: 9px; background: #fff; color: var(--navy); font-size: 10.5px; }
.lbl.person.empty { background: rgba(90, 101, 119, .85); }

.profile .drive { margin-top: 10px; border: 0; background: var(--navy); color: #fff; font: inherit; font-size: 12px; font-weight: 700; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
/* 조종 막대: 짙은 둥근 막대(게임 느낌) */
.ctrl { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: 18px; display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: calc(100vw - 20px); }
.ctrl[hidden] { display: none; }
.ctrl .ctx { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.ctrl .me { display: inline-flex; align-items: center; gap: 8px; background: rgba(245, 246, 248, .96); color: #1b1f24; border-radius: 999px; padding: 5px 14px 5px 5px; font-weight: 800; font-size: 14px; box-shadow: 0 8px 20px -10px rgba(0, 0, 0, .45); }
.ctrl .me i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; background: #4f86e8; color: #fff; display: grid; place-items: center; font-size: 13px; }
.ctrl .pill { border: 0; border-radius: 999px; padding: 10px 18px; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; background: rgba(38, 40, 45, .92); color: #f4f5f7; box-shadow: 0 10px 24px -12px rgba(0, 0, 0, .6); transition: transform .12s ease, background .12s ease; }
.ctrl .pill.primary { background: #4f86e8; color: #fff; }
.ctrl .pill:hover { transform: translateY(-1px); }
.ctrl .bar { display: flex; align-items: center; gap: 4px; background: rgba(38, 40, 45, .94); border-radius: 999px; padding: 6px 6px 6px 14px; box-shadow: 0 14px 34px -14px rgba(0, 0, 0, .7); max-width: 100%; }
.ctrl .bar > button:not(.send) { border: 0; background: transparent; color: #e9eaee; font: inherit; font-size: 14px; font-weight: 700; padding: 8px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.ctrl .bar > button:not(.send):hover { background: rgba(255, 255, 255, .08); }
.ctrl kbd { font: inherit; font-size: 11px; font-weight: 700; color: #b9bdc6; background: rgba(255, 255, 255, .12); border-radius: 6px; padding: 1px 6px; }
.ctrl #say { flex: 1 1 200px; min-width: 120px; border: 0; outline: 0; background: rgba(255, 255, 255, .08); color: #fff; border-radius: 999px; padding: 10px 16px; font: inherit; font-size: 14px; margin-left: 6px; }
.ctrl #say::placeholder { color: #8d929c; }
.ctrl .send { border: 0; border-radius: 999px; background: #4f86e8; color: #fff; font: inherit; font-weight: 800; font-size: 14px; padding: 10px 18px; cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
.ctrl .hint { font-size: 11px; color: rgba(255, 255, 255, .85); text-shadow: 0 1px 3px rgba(0, 0, 0, .6); text-align: center; }
.chip.where { position: fixed; z-index: 20; top: 16px; left: 50%; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; background: rgba(38, 40, 45, .92); color: #f4f5f7; border-radius: 999px; padding: 9px 18px; font-weight: 800; font-size: 14px; box-shadow: 0 10px 24px -12px rgba(0, 0, 0, .6); }
.chip.where[hidden] { display: none; }
.chip.where svg { width: 18px; height: 18px; }
@media (max-width: 640px) { .ctrl .bar { flex-wrap: wrap; border-radius: 22px; justify-content: center; } .ctrl #say { flex-basis: 100%; margin: 4px 0 0; } }

.lbl.bubble { background: rgba(32, 34, 38, .94); color: #fff; font-size: 15px; font-weight: 800; padding: 8px 14px; border-radius: 16px; box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .55); animation: pop .35s ease-out; max-width: 220px; white-space: normal; text-align: center; }
@keyframes pop { from { transform: translateY(-4px) scale(.6); } to { transform: translateY(-4px) scale(1); } }
@media (prefers-reduced-motion: reduce) { .lbl.bubble { animation: none; } }

/* ================= 사무실 생활(임무·출석·칭찬·꾸미기) ================= */
.hud { left: 20px; top: 128px; display: flex; align-items: center; gap: 4px; padding: 5px 6px; border-radius: 999px; flex-wrap: wrap; max-width: calc(100vw - 320px); }
.hud svg { width: 16px; height: 16px; flex: none; }
.hud .who { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; font: inherit; font-weight: 800; font-size: 13.5px; color: var(--navy); cursor: pointer; padding: 2px 8px 2px 2px; border-radius: 999px; }
.hud .who i { font-style: normal; width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 11px; }
.hud .who.pick { padding: 6px 12px; gap: 6px; background: var(--navy); color: #fff; }
.hud .hint2 { font-size: 12px; color: var(--muted); padding-right: 8px; }
.hud .stat { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 800; padding: 4px 8px; border-radius: 999px; background: rgba(27, 54, 93, .06); }
.stat.star { color: #c98a1c; } .stat.star b { color: var(--ink); }
.stat.streak { color: #e8673a; } .stat.streak b { color: var(--ink); } .stat.streak.zero { color: #9aa6b5; }
.hud .sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }
.hud .hb { position: relative; display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; font: inherit; font-size: 12.5px; font-weight: 700; color: var(--ink); padding: 6px 9px; border-radius: 999px; cursor: pointer; transition: background .15s; }
.hud .hb:hover { background: rgba(27, 54, 93, .08); }
.hud .hb em { font-style: normal; min-width: 17px; height: 17px; border-radius: 9px; background: #e0485b; color: #fff; font-size: 10.5px; display: grid; place-items: center; padding: 0 4px; }
.hud .hb.glow { background: var(--navy); color: #fff; animation: glow 1.8s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 5px rgba(47, 111, 224, .22); } }

.life { right: 20px; top: 20px; z-index: 30; width: 370px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; overflow: hidden; background: rgba(255, 255, 255, .93); }
.life[hidden] { display: none; }
.life header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 6px; }
.life header b { font-size: 16px; color: var(--navy); }
.life .x { border: 0; background: transparent; font-size: 22px; color: var(--muted); cursor: pointer; line-height: 1; }
.life .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 0 12px; padding: 3px; background: rgba(27, 54, 93, .07); border-radius: 11px; }
.life .tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 700; color: var(--muted); padding: 7px 0 6px; border-radius: 9px; cursor: pointer; }
.life .tabs svg { width: 18px; height: 18px; }
.life .tabs button.on { background: #fff; color: var(--navy); box-shadow: 0 3px 10px -5px rgba(27, 54, 93, .5); }
.life .body { overflow: auto; padding: 6px 16px 16px; }
.life h4 { margin: 14px 0 8px; font-size: 13px; color: var(--navy); display: flex; justify-content: space-between; align-items: baseline; }
.life h4 small { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.life .tip { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; line-height: 1.5; }
.life .note { font-size: 12.5px; background: #eef3fb; color: var(--navy); border-radius: 10px; padding: 9px 12px; margin: 10px 0 0; }
.life .empty { color: var(--muted); font-size: 12.5px; list-style: none; padding: 10px 2px; }
.go { border: 0; border-radius: 999px; background: var(--navy); color: #fff; font: inherit; font-size: 13px; font-weight: 800; padding: 9px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.go svg { width: 14px; height: 14px; color: #ffd45e; }
.go.sm { padding: 6px 12px; font-size: 12px; }
.go.wide { width: 100%; justify-content: center; }
.go:disabled { background: #b9c2cf; cursor: default; }
.go:disabled svg { color: #fff; }

.ml { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.mi { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; background: #fff; border: 1px solid var(--line); }
.mi.mine { border-color: rgba(47, 111, 224, .45); box-shadow: 0 4px 14px -8px rgba(47, 111, 224, .6); }
.mi > i { width: 34px; height: 34px; border-radius: 10px; background: rgba(27, 54, 93, .08); color: var(--navy); display: grid; place-items: center; flex: none; }
.mi.mine > i { background: #2f6fe0; color: #fff; }
.mi > i svg { width: 20px; height: 20px; }
.mi > div { flex: 1; min-width: 0; }
.mi b { display: block; font-size: 13.5px; }
.mi small { display: inline-flex; align-items: center; gap: 2px; font-size: 11.5px; color: #c98a1c; font-weight: 700; }
.mi small svg { width: 12px; height: 12px; }
.mi .who2 { font-size: 12px; color: var(--muted); font-weight: 700; }
.mi .ok { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 800; color: #3fa37a; }
.mi .ok svg { width: 16px; height: 16px; }
.mi.done { opacity: .7; } .mi.done b { text-decoration: line-through; text-decoration-color: rgba(0, 0, 0, .3); }

.att-head { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 8px; }
.att-head b { font-size: 14.5px; color: var(--navy); }
.att-head span { font-size: 12px; color: var(--muted); font-weight: 700; }
.att-head .stat { font-size: 14px; }
.att-head .stat svg { width: 16px; height: 16px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: #fbf8f1; border: 1px solid #ece4d3; border-radius: 14px; padding: 10px 8px; }
.cal .dw { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding-bottom: 2px; }
.cal .dw.sun { color: #d9534f; } .cal .dw.sat { color: #4f86e8; }
.cal .dc { position: relative; aspect-ratio: 1; border-radius: 9px; background: #fff; border: 1px solid #efe8d9; display: grid; place-items: center; }
.cal .dc em { position: absolute; top: 3px; left: 5px; font-style: normal; font-size: 10px; color: #8a8072; font-weight: 700; }
.cal .dc.wk { background: #f6f2ea; }
.cal .dc.today { border: 2px solid var(--navy); }
.seal { font-style: normal; width: 76%; aspect-ratio: 1; border-radius: 50%; border: 2px solid #c8102e; color: #c8102e; font-size: 9.5px; font-weight: 900; display: grid; place-items: center; transform: rotate(-14deg); background: rgba(200, 16, 46, .06); letter-spacing: -.02em; }
.seal.pop { animation: stamp .5s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes stamp { from { transform: rotate(-30deg) scale(2.4); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: 1; } }
.att-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; font-size: 12.5px; font-weight: 700; }
.att-foot .big { display: inline-flex; align-items: center; gap: 3px; font-size: 18px; font-weight: 900; color: #e8673a; }
.att-foot .big svg { width: 20px; height: 20px; }
.att-foot small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 2px; }

.stk { --c: #4f86e8; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: var(--c); color: #fff; border: 3px solid #fff; box-shadow: 0 6px 14px -6px rgba(0, 0, 0, .45), 0 0 0 1px rgba(0, 0, 0, .05); transform: rotate(-6deg); }
.stk svg { width: 18px; height: 18px; color: #fff3c4; }
.stk b { font-size: 11px; font-weight: 900; letter-spacing: -.03em; }
.stk.sm { width: 40px; height: 40px; border-width: 2px; flex: none; }
.stk.sm svg { width: 12px; height: 12px; } .stk.sm b { font-size: 8px; }
.stk-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stk-c { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.stk-c > b { font-size: 14px; color: var(--navy); }
.life select.to { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 13px; background: #fff; }
.pl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pl li { display: flex; gap: 10px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; }
.pl li.empty { background: transparent; border: 0; }
.pl li > div { flex: 1; font-size: 12.5px; } .pl li p { margin: 2px 0 0; color: var(--muted); }
.pl li small { font-size: 11px; color: var(--muted); }

.shop { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.si { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.si b { font-size: 13px; }
.si img { width: 100%; aspect-ratio: 1.35; object-fit: contain; background: radial-gradient(circle at 50% 60%, #fff 0%, #eef2f7 75%); border-radius: 9px; }
.si.own { background: #f4f7fc; }
.tg { border: 1px solid var(--line); background: #fff; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 700; padding: 5px 11px; cursor: pointer; color: var(--muted); }
.tg.on { background: #3fa37a; border-color: #3fa37a; color: #fff; }

.modal { position: fixed; inset: 0; z-index: 40; background: rgba(15, 25, 40, .38); display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal .sheet { width: min(420px, 100%); background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .5); display: flex; flex-direction: column; gap: 12px; }
.modal .t { font-size: 17px; color: var(--navy); }
.modal .s { margin: -6px 0 0; font-size: 12.5px; color: var(--muted); }
.modal .names { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-height: 50vh; overflow: auto; }
.modal .names button { border: 1px solid var(--line); background: #f7f9fc; border-radius: 10px; padding: 9px 0; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
.modal .names button:hover, .modal .names button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.modal .ghost { padding: 9px 16px; }
.modal .stks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.modal .stks button { border: 2px solid transparent; background: transparent; border-radius: 16px; padding: 8px 0; cursor: pointer; display: grid; place-items: center; }
.modal .stks button.on { border-color: var(--navy); background: #eef3fb; }
.modal .msg { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 13.5px; }
.modal .row2 { display: flex; align-items: center; gap: 6px; }
.modal .row2 .left { flex: 1; font-size: 12px; color: var(--muted); }

#toast { position: fixed; z-index: 50; left: 50%; top: 70px; transform: translateX(-50%); background: rgba(28, 34, 48, .95); color: #fff; padding: 11px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .6); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
#toast[hidden] { display: none; }
#toast svg { width: 16px; height: 16px; color: #ffd45e; }
#toast.show { animation: toast .45s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes toast { from { transform: translateX(-50%) translateY(-14px) scale(.85); opacity: 0; } }

/* 3D 임무 표지 */
.lbl.mission { display: flex; align-items: center; gap: 6px; padding: 4px 11px 4px 4px; border-radius: 999px; background: rgba(255, 255, 255, .95); color: var(--ink); font-size: 12px; font-weight: 800; box-shadow: 0 8px 18px -8px rgba(0, 0, 0, .45); }
.lbl.mission i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(27, 54, 93, .1); color: var(--navy); }
.lbl.mission i svg { width: 15px; height: 15px; }
.lbl.mission em { font-style: normal; font-weight: 600; font-size: 10.5px; color: var(--muted); }
.lbl.mission.mine { background: #2f6fe0; color: #fff; animation: bob 1.6s ease-in-out infinite; }
.lbl.mission.mine i { background: #fff; color: #2f6fe0; }
.lbl.mission.mine em { color: #dbe7ff; }
.lbl.mission.done { background: rgba(236, 240, 245, .92); color: #7d8796; }
.lbl.mission.done i { background: #3fa37a; color: #fff; }
.lbl.mission.preview { opacity: .82; }
@keyframes bob { 50% { transform: translateY(-9px); } }
.ctrl .pill.mission { background: #e8a33c; color: #fff; display: inline-flex; align-items: center; gap: 6px; animation: glow 1.6s ease-in-out infinite; }
.ctrl .pill.mission[hidden] { display: none; }
.ctrl .pill.mission svg { width: 16px; height: 16px; }
.ctrl .pill.mission small { font-weight: 700; opacity: .85; }

/* 프로필 카드 안 칭찬 줄 */
.profile .praise-row:empty { display: none; }
.profile .praise-row { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.profile .praise-row .chips { display: flex; gap: 4px; flex-wrap: wrap; }
.profile .praise-row .mini { --c: #4f86e8; font-size: 10.5px; font-weight: 800; color: #fff; background: var(--c); border-radius: 999px; padding: 2px 8px; }
.profile .praise-btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(224, 111, 139, .5); background: #fff4f7; color: #c24a68; font: inherit; font-size: 12px; font-weight: 800; padding: 6px 11px; border-radius: 8px; cursor: pointer; }
.profile .praise-btn svg { width: 14px; height: 14px; }
.profile .info { min-width: 0; }

@media (max-width: 720px) {
  .hud { left: 10px; right: 10px; max-width: none; border-radius: 16px; }
  .hud .hb { padding: 6px 7px; }
  .life { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 72vh; }
  .modal .names { grid-template-columns: repeat(3, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .lbl.mission.mine, .hud .hb.glow, .ctrl .pill.mission, .seal.pop, #toast.show { animation: none; } }

/* 상점 갈래 제목 */
.shop-cat { margin: 14px 0 0; font-size: 12px; font-weight: 700; color: #5a6577; letter-spacing: .02em; }
.shop-cat:first-of-type { margin-top: 10px; }

</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",

} }

</head>
<body>
<canvas id="c"></canvas>

<header class="card brand">
  <div class="eyebrow">도산대로 311 · 3F</div>
  <h1>법무법인(유한) 창천</h1>
  <p class="sub">드래그로 돌려 보기 · 휠로 확대 · 사람이나 방을 누르면 프로필</p>
</header>

<nav class="card controls">
  <div class="row">
    <button id="btn-home" class="ghost">전체 보기</button>
    <button id="btn-eye" class="ghost">눈높이</button>
    <button id="btn-city" class="ghost">도시 보기</button>
  </div>
  <button id="btn-names" class="toggle on">이름표 켜짐</button>
  <div id="search-wrap">
    <input id="q" type="search" placeholder="이름 검색 (예: 윤제선)" autocomplete="off">
    <ul id="results"></ul>
  </div>
</nav>

<div id="tip" hidden></div>
<aside id="card" class="card profile" hidden>
  <button class="close" aria-label="닫기">×</button>
  <div class="photo"></div>
  <div class="info">
    <div class="name"></div>
    <div class="title"></div>
    <div class="fields"></div>
    <div class="where"></div>
    <div class="praise-row"></div>
    <button class="drive" hidden>조종하기</button>
  </div>
</aside>
<div id="where" class="chip where" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zm0 2.1 6 2v11.8l-6-2V6.1z" fill="currentColor"/></svg>
  <b id="where-name"></b>
</div>
<div id="ctrlbar" class="ctrl" hidden>
  <div class="ctx">
    <span class="me"><i>나</i><b id="ctrl-name"></b></span>
    <button data-act="mission" id="mission-btn" class="pill mission" hidden></button>
    <button data-act="home" class="pill">내 자리로 가기</button>
    <button data-act="end" class="pill primary">조종 끝</button>
  </div>
  <div class="bar">
    <button data-act="bow">인사 <kbd>1</kbd></button>
    <button data-act="wave">손 흔들기 <kbd>2</kbd></button>
    <button data-act="coffee">커피 <kbd>3</kbd></button>
    <button data-act="praise">응원 <kbd>4</kbd></button>
    <input id="say" type="text" placeholder="말하기 (Enter)" maxlength="40" autocomplete="off">
    <button data-act="say" class="send">보내기</button>
  </div>
  <div class="hint">바닥을 누르거나 방향키·W·A·S·D로 걷기 · 숫자 1~4 동작 · Esc 끝내기</div>
</div>
<footer class="credit">주변 건물 © OpenStreetMap contributors</footer>

<div id="loading"><div class="box"><b>3D 사무실 불러오는 중</b><div class="bar"><i></i></div></div></div>
<script type="module" src="./main.js?v=20261128101832"></script>
</body>
</html>
